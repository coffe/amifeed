[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amifeed"
version = "0.1.0"
description = "A plain text RSS proxy for retro computers (Google Reader API / FreshRSS)"
readme = "../README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["feedparser>=6", "trafilatura>=1.6", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
amifeed = "amifeed.__main__:main"

[tool.setuptools]
packages = ["amifeed"]

[tool.pytest.ini_options]
pythonpath = ["."]
